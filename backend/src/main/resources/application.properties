spring.application.name=backend

# Load environment variables from root .env file
spring.config.import=optional:file:../.env[.properties]

# Supabase
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret-key=${SUPABASE_SECRET_KEY}

# Supabase Auth JWT verification (derived from the project URL; no JWT secret)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${supabase.url}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${supabase.url}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

# Gemini (backend only)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.timeout-millis=2000
